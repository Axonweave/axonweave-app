[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez (enforce UTC)
]
ignore = [
    "S101",  # assert used in tests
    "S104",  # binding to 0.0.0.0 in dev
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "F841"]
"alembic/**" = ["E501"]
"app/core/email_templates.py" = ["E501"]
"app/**/*routes.py" = ["B008"]  # FastAPI Depends/Query in defaults is intentional

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "scripts/"]

[[tool.mypy.overrides]]
module = ["app.ai.*", "app.modules.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = ["live: calls the real provider; needs a key and is skipped without one"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/ai/*", "alembic/*"]
# SQLAlchemy async runs service code inside greenlets; without this, coverage under-reports.
concurrency = ["greenlet", "thread"]
