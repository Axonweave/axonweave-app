name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────────
  backend-ci:
    name: Backend — lint, type-check, migrate, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: axonweave_test
          POSTGRES_USER: axonweave_owner
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axonweave_owner -d axonweave_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    # Throwaway values for an ephemeral CI database; APP_ENV=testing. Not real secrets
    # (allow-listed in .gitleaks.toml).
    env:
      APP_ENV: testing
      APP_SECRET_KEY: ci_test_secret_key_at_least_32_characters_long
      DATABASE_URL: postgresql+psycopg://axonweave_owner:test_password@localhost:5432/axonweave_test
      DATABASE_MIGRATION_URL: postgresql+psycopg://axonweave_owner:test_password@localhost:5432/axonweave_test
      DATABASE_TEST_URL: postgresql+psycopg://axonweave_owner:test_password@localhost:5432/axonweave_test
      FRONTEND_URL: http://localhost:3000
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check . && ruff format --check .

      - name: Type-check (mypy)
        run: mypy app

      - name: Run Alembic migration
        run: alembic upgrade head

      - name: Check exactly one Alembic head
        run: |
          heads=$(alembic heads | grep -c "head")
          if [ "$heads" -ne 1 ]; then
            echo "ERROR: Expected exactly 1 Alembic head, found $heads"
            alembic heads
            exit 1
          fi

      - name: Run tests (coverage must stay at or above 85%)
        run: pytest --tb=short --cov=app --cov-report=term-missing --cov-fail-under=85

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend — lint, type-check, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Unit tests (Vitest)
        run: npm run test
      - name: Build
        run: npm run build

  # ── End-to-end (full stack in Docker Compose) ───────────────────────────────
  e2e:
    name: E2E — Playwright against the full stack
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    env:
      # Behind no proxy in CI; lets each test user register from a distinct "IP" so the
      # per-IP registration limit (D-18) does not interfere. Never enable this in production
      # without a trusted proxy.
      TRUST_PROXY_HEADERS: "true"
      PW_EXTERNAL_STACK: "1"
      # AI Tutor e2e tests use the deterministic FakeProvider (D-60), never a real key. The delay
      # between chunks lets the Stop test press the button mid-stream.
      LLM_PROVIDER: fake
      FAKE_LLM_CHUNK_DELAY_SECONDS: "0.1"

    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for the app
        run: curl --fail --silent --retry 40 --retry-all-errors --retry-connrefused --retry-delay 3 http://localhost:3000/login > /dev/null

      - name: Apply migrations
        run: docker compose exec -T backend alembic upgrade head

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies and browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright (desktop and mobile projects)
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --tail 200

  # ── Security scans ──────────────────────────────────────────────────────────
  security:
    name: Security — secrets and dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks, full history)
        run: |
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:latest \
            detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner --log-opts="--all"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Audits the packages that are actually INSTALLED (including transitive ones such as
      # starlette), not just the names listed in requirements.txt. A requirements-file audit with
      # --no-deps cannot see transitive dependencies. pip-audit exits non-zero on any known
      # vulnerability, which fails this job. Do not add "|| true".
      - name: Python dependency audit (installed runtime and dev environments)
        working-directory: backend
        run: |
          python -m venv "$RUNNER_TEMP/audit-tool"
          "$RUNNER_TEMP/audit-tool/bin/pip" install --quiet pip-audit
          for reqs in requirements.txt requirements-dev.txt; do
            echo "::group::pip-audit installed environment from $reqs"
            env="$RUNNER_TEMP/env-${reqs%.txt}"
            python -m venv "$env"
            "$env/bin/pip" install --quiet --upgrade pip
            "$env/bin/pip" install --quiet -r "$reqs"
            sitepackages="$("$env/bin/python" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
            "$RUNNER_TEMP/audit-tool/bin/pip-audit" --strict --path "$sitepackages"
            echo "::endgroup::"
          done

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: npm audit (fail on high or critical)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
