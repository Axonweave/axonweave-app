name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────────
  backend-ci:
    name: Backend — lint, type-check, migrate, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: axonweave_test
          POSTGRES_USER: axonweave_owner
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axonweave_owner -d axonweave_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: testing
      APP_SECRET_KEY: ci_test_secret_key_at_least_32_characters_long
      DATABASE_URL: postgresql+psycopg://axonweave_owner:test_password@localhost:5432/axonweave_test
      DATABASE_MIGRATION_URL: postgresql+psycopg://axonweave_owner:test_password@localhost:5432/axonweave_test
      DATABASE_TEST_URL: postgresql+psycopg://axonweave_owner:test_password@localhost:5432/axonweave_test
      FRONTEND_URL: http://localhost:3000
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check . && ruff format --check .

      - name: Type-check (mypy)
        run: mypy app

      - name: Run Alembic migration
        run: alembic upgrade head

      - name: Check exactly one Alembic head
        run: |
          heads=$(alembic heads | grep -c "head")
          if [ "$heads" -ne 1 ]; then
            echo "ERROR: Expected exactly 1 Alembic head, found $heads"
            alembic heads
            exit 1
          fi

      - name: Run tests
        run: pytest --tb=short --cov=app --cov-report=term-missing

  # ── Frontend (placeholder until B0 lands) ────────────────────────────────────
  frontend-ci:
    name: Frontend — lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check frontend exists
        id: frontend_check
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Frontend not yet initialised (B0 pending). Skipping."
          fi

      - name: Set up Node 22
        if: steps.frontend_check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.frontend_check.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        if: steps.frontend_check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        if: steps.frontend_check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build
