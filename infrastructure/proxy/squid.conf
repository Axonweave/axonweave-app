# Allow-listed egress for the worker (D-70): HTTPS CONNECT to the embedding provider, and to the
# Wikipedia API for the subject graph's web source (D-145). Nothing else.
http_port 3128
acl embedding_hosts dstdomain generativelanguage.googleapis.com
acl wikipedia_hosts dstdomain en.wikipedia.org
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access allow CONNECT embedding_hosts SSL_ports
http_access allow CONNECT wikipedia_hosts SSL_ports
http_access deny all
access_log none
cache deny all
