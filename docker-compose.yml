# Shared by the worker and beat (same codebase as the API). The API lists the same Phase 3 variables below.
# There is no env_file: every variable must be passed through here.
# LLM settings the Celery worker needs for study generation (Phase 4, D-88): generation runs in the
# worker, never in the API process. The API keeps its own copy of the same variables below.
x-llm-env: &llm-env
  LLM_PROVIDER: ${LLM_PROVIDER:-}
  FAKE_LLM_CHUNK_DELAY_SECONDS: ${FAKE_LLM_CHUNK_DELAY_SECONDS:-0}
  LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-}
  LLM_ALLOWED_MODELS: ${LLM_ALLOWED_MODELS:-}
  LLM_MODEL_MAX_INPUT_TOKENS: ${LLM_MODEL_MAX_INPUT_TOKENS:-}
  LLM_MODEL_MAX_OUTPUT_TOKENS: ${LLM_MODEL_MAX_OUTPUT_TOKENS:-}
  LLM_CONNECT_TIMEOUT_SECONDS: ${LLM_CONNECT_TIMEOUT_SECONDS:-10}
  LLM_GENERATION_TIMEOUT_SECONDS: ${LLM_GENERATION_TIMEOUT_SECONDS:-60}
  LLM_OVERALL_TIMEOUT_SECONDS: ${LLM_OVERALL_TIMEOUT_SECONDS:-120}
  LLM_THINKING_BUDGET: ${LLM_THINKING_BUDGET:-}
  STUDY_GENERATION_MODEL: ${STUDY_GENERATION_MODEL:-}
  STUDY_MAX_INPUT_TOKENS: ${STUDY_MAX_INPUT_TOKENS:-60000}
  STUDY_MAX_OUTPUT_TOKENS: ${STUDY_MAX_OUTPUT_TOKENS:-4000}
  STUDY_JOB_TIMEOUT_SECONDS: ${STUDY_JOB_TIMEOUT_SECONDS:-540}
  STUDY_MAX_SCOPE_TOKENS: ${STUDY_MAX_SCOPE_TOKENS:-500000}
  STUDY_MAX_SOURCES_PER_REQUEST: ${STUDY_MAX_SOURCES_PER_REQUEST:-50}
  STUDY_MAX_TEXT_SOURCE_CHARS: ${STUDY_MAX_TEXT_SOURCE_CHARS:-20000}
  STUDY_DAILY_GENERATION_QUOTA: ${STUDY_DAILY_GENERATION_QUOTA:-20}
  STUDY_MAX_ACTIVE_JOBS_PER_USER: ${STUDY_MAX_ACTIVE_JOBS_PER_USER:-2}
  STUDY_REQUESTS_PER_MINUTE_PER_USER: ${STUDY_REQUESTS_PER_MINUTE_PER_USER:-10}
  STUDY_PROVIDER_MAX_RETRIES: ${STUDY_PROVIDER_MAX_RETRIES:-1}
  STUDY_TASK_SOFT_TIME_LIMIT_SECONDS: ${STUDY_TASK_SOFT_TIME_LIMIT_SECONDS:-570}
  STUDY_TASK_HARD_TIME_LIMIT_SECONDS: ${STUDY_TASK_HARD_TIME_LIMIT_SECONDS:-600}
  STUDY_STALE_JOB_SECONDS: ${STUDY_STALE_JOB_SECONDS:-900}
  STUDY_CANCEL_POLL_SECONDS: ${STUDY_CANCEL_POLL_SECONDS:-1.0}

x-phase3-env: &phase3-env
  STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
  STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-http://objectstore:8333}
  STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
  STORAGE_BUCKET: ${STORAGE_BUCKET:-axonweave-documents}
  STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-axonweave_dev_access}
  STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-axonweave_dev_secret_key}
  STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}
  STORAGE_SERVER_SIDE_ENCRYPTION: ${STORAGE_SERVER_SIDE_ENCRYPTION:-}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
  CELERY_TASK_SOFT_TIME_LIMIT_SECONDS: ${CELERY_TASK_SOFT_TIME_LIMIT_SECONDS:-240}
  CELERY_TASK_HARD_TIME_LIMIT_SECONDS: ${CELERY_TASK_HARD_TIME_LIMIT_SECONDS:-300}
  CELERY_MAX_RETRIES: ${CELERY_MAX_RETRIES:-3}
  RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-redis}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
  EMBEDDING_INDEX_VERSION: ${EMBEDDING_INDEX_VERSION:-1}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
  EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
  DOC_MAX_FILE_BYTES: ${DOC_MAX_FILE_BYTES:-26214400}
  DOC_MAX_FILES_PER_REQUEST: ${DOC_MAX_FILES_PER_REQUEST:-5}
  DOC_MAX_DOCUMENTS_PER_USER: ${DOC_MAX_DOCUMENTS_PER_USER:-200}
  DOC_MAX_TOTAL_BYTES_PER_USER: ${DOC_MAX_TOTAL_BYTES_PER_USER:-1073741824}
  DOC_MAX_PAGES: ${DOC_MAX_PAGES:-500}
  DOC_MAX_EXTRACTED_CHARS: ${DOC_MAX_EXTRACTED_CHARS:-2000000}
  DOC_ZIP_MAX_ENTRIES: ${DOC_ZIP_MAX_ENTRIES:-2000}
  DOC_ZIP_MAX_UNCOMPRESSED_BYTES: ${DOC_ZIP_MAX_UNCOMPRESSED_BYTES:-209715200}
  DOC_ZIP_MAX_RATIO: ${DOC_ZIP_MAX_RATIO:-100}
  DOC_IMAGE_MAX_PIXELS: ${DOC_IMAGE_MAX_PIXELS:-50000000}
  DOC_OCR_ENABLED: ${DOC_OCR_ENABLED:-true}
  DOC_OCR_DPI: ${DOC_OCR_DPI:-200}
  DOC_OCR_LANGUAGES: ${DOC_OCR_LANGUAGES:-eng}
  SCANNER_BACKEND: ${SCANNER_BACKEND:-none}
  CLAMAV_HOST: ${CLAMAV_HOST:-}
  CLAMAV_PORT: ${CLAMAV_PORT:-3310}
  CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-30}

x-core-env: &core-env
  APP_ENV: ${APP_ENV:-development}
  APP_SECRET_KEY: ${APP_SECRET_KEY:-change_me_in_production_use_32_plus_chars}
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://axonweave_app:axonweave_app_dev_password@postgres:5432/axonweave}
  DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:-postgresql+psycopg://axonweave_owner:${DB_OWNER_PASSWORD:-axonweave_owner_dev_password}@postgres:5432/axonweave}

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: axonweave
      POSTGRES_USER: axonweave_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:-axonweave_owner_dev_password}
    volumes:
      # New volume name on purpose: the old alpine-based volume is not reusable by the Debian pgvector
      # image (different libc collation). The old volume is left untouched; see docs/SETUP.md.
      - pgvector_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
      - ./infrastructure/docker/init-test-db.sh:/docker-entrypoint-initdb.d/02-init-test-db.sh:ro
    ports:
      - "5432:5432"
    networks: [default, internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axonweave_owner -d axonweave"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]   # broker and limiter only; nothing to persist
    networks: [default, internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  objectstore:
    # S3-compatible emulator (D-63). Tag verified 2026-11-06 (SeaweedFS 4.50).
    image: chrislusf/seaweedfs:4.50
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-ip.bind=0.0.0.0"]
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-axonweave_dev_access}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-axonweave_dev_secret_key}
    volumes:
      - objectstore_data:/data
    ports:
      - "127.0.0.1:8333:8333"   # S3 API for local debugging only
    networks: [default, internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  storage-init:
    # One-shot: creates the private bucket if missing (idempotent), then exits.
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api
    restart: "no"
    environment:
      <<: [*phase3-env, *core-env]
    command: ["python", "scripts/ensure_bucket.py"]
    volumes:
      - ./backend:/app:ro   # development: live source; a production image bakes the code in
    depends_on:
      objectstore:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    # Only the internal network: no direct route to the internet (D-70). The only way out is the
    # allow-listed egress-proxy, which permits HTTPS to the embedding provider host and nothing else.
    networks: [internal]
    environment:
      <<: [*phase3-env, *core-env, *llm-env]
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      HTTPS_PROXY: http://egress-proxy:3128
      NO_PROXY: redis,postgres,objectstore,localhost
    volumes:
      - ./backend:/app:ro   # development: live source; a production image bakes the code in
    read_only: true
    tmpfs:
      - /scratch:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      objectstore:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.ingestion.worker:celery_app inspect ping -d celery@$$HOSTNAME -t 5 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    command: ["celery", "-A", "app.ingestion.worker:celery_app", "beat", "--loglevel=INFO", "--schedule=/scratch/celerybeat-schedule"]
    environment:
      <<: [*phase3-env, *core-env]
    networks: [internal]
    volumes:
      - ./backend:/app:ro   # development: live source; a production image bakes the code in
    read_only: true
    tmpfs:
      - /scratch:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      redis:
        condition: service_healthy

  egress-proxy:
    image: ubuntu/squid:latest
    restart: unless-stopped
    volumes:
      - ./infrastructure/proxy/squid.conf:/etc/squid/squid.conf:ro
    networks: [internal, default]

  clamav:
    image: clamav/clamav:stable
    profiles: ["scan"]   # optional: docker compose --profile scan up, then SCANNER_BACKEND=clamav CLAMAV_HOST=clamav
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      <<: [*phase3-env, *llm-env]
      APP_ENV: ${APP_ENV:-development}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-change_me_in_production_use_32_plus_chars}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://axonweave_app:axonweave_app_dev_password@postgres:5432/axonweave}
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:-postgresql+psycopg://axonweave_owner:${DB_OWNER_PASSWORD:-axonweave_owner_dev_password}@postgres:5432/axonweave}
      DATABASE_TEST_URL: ${DATABASE_TEST_URL:-postgresql+psycopg://axonweave_owner:${DB_OWNER_PASSWORD:-axonweave_owner_dev_password}@postgres:5432/axonweave_test}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mailpit}
      SMTP_HOST: mailpit  # service name; a host-side .env value (localhost) is unreachable from the container
      SMTP_PORT: 1025
      # AI (Phase 2). Everything is optional; with LLM_PROVIDER empty the app runs and AI answers 503.
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      FAKE_LLM_CHUNK_DELAY_SECONDS: ${FAKE_LLM_CHUNK_DELAY_SECONDS:-0}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-}
      LLM_ALLOWED_MODELS: ${LLM_ALLOWED_MODELS:-}
      LLM_MODEL_MAX_INPUT_TOKENS: ${LLM_MODEL_MAX_INPUT_TOKENS:-}
      LLM_MODEL_MAX_OUTPUT_TOKENS: ${LLM_MODEL_MAX_OUTPUT_TOKENS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_CONNECT_TIMEOUT_SECONDS: ${LLM_CONNECT_TIMEOUT_SECONDS:-10}
      LLM_GENERATION_TIMEOUT_SECONDS: ${LLM_GENERATION_TIMEOUT_SECONDS:-60}
      LLM_STREAM_INACTIVITY_TIMEOUT_SECONDS: ${LLM_STREAM_INACTIVITY_TIMEOUT_SECONDS:-30}
      LLM_OVERALL_TIMEOUT_SECONDS: ${LLM_OVERALL_TIMEOUT_SECONDS:-120}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-2000}
      LLM_MAX_INPUT_CHARS: ${LLM_MAX_INPUT_CHARS:-8000}
      LLM_HISTORY_LIMIT: ${LLM_HISTORY_LIMIT:-20}
      LLM_THINKING_BUDGET: ${LLM_THINKING_BUDGET:-}
      AI_MAX_ACTIVE_GENERATIONS_PER_USER: ${AI_MAX_ACTIVE_GENERATIONS_PER_USER:-2}
      AI_REQUESTS_PER_MINUTE_PER_USER: ${AI_REQUESTS_PER_MINUTE_PER_USER:-10}
      AI_DAILY_MESSAGE_QUOTA: ${AI_DAILY_MESSAGE_QUOTA:-50}
      AI_DAILY_TOKEN_QUOTA: ${AI_DAILY_TOKEN_QUOTA:-200000}
      AI_STALE_GENERATION_SECONDS: ${AI_STALE_GENERATION_SECONDS:-300}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

networks:
  default: {}
  # No external route: the worker lives here (D-70).
  internal:
    internal: true

volumes:
  pgvector_data:
  objectstore_data:
  mailpit_data:
